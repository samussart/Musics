<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* base solicitada + análogas (roxo -> azul-violeta -> rosa-violeta) */
    --base: #DAC4F7;
    --analog-blue: #C4CFF7;
    --analog-pink: #F7C4E4;

    --bg: #0A0714;
    --bg-2: #130B22;
    --bg-3: #1C1130;
    --card: #170F28;
    --card-edge: #33224E;

    --neon-purple: #B266FF;
    --neon-pink: #FF4FD8;
    --neon-blue: #4FE0FF;

    --ink: #F4ECFF;
    --ink-soft: #B6A6DA;

    --glow-purple: rgba(178,102,255,0.55);
    --glow-pink: rgba(255,79,216,0.5);
    --glow-blue: rgba(79,224,255,0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
  }

  body {
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 30px 16px 70px;
  }

  /* ===== fundo cyber: estrelas + grade retrô + glow ===== */
  .cyber-bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; background: var(--bg); }

  .glow-orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.45; }
  .glow-orb.o1 { width: 380px; height: 380px; background: var(--neon-purple); top: -140px; left: -80px; }
  .glow-orb.o2 { width: 340px; height: 340px; background: var(--neon-pink); top: 10%; right: -120px; }
  .glow-orb.o3 { width: 300px; height: 300px; background: var(--neon-blue); bottom: -100px; left: 10%; }

  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute; border-radius: 50%;
    background: var(--ink);
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

  .grid-floor {
    position: absolute; left: -25%; right: -25%; bottom: -8%; height: 46%;
    background-image:
      linear-gradient(var(--neon-purple) 1px, transparent 1px),
      linear-gradient(90deg, var(--neon-purple) 1px, transparent 1px);
    background-size: 46px 46px;
    transform: perspective(280px) rotateX(62deg);
    transform-origin: bottom;
    opacity: 0.35;
    mask-image: linear-gradient(to top, black, transparent);
    -webkit-mask-image: linear-gradient(to top, black, transparent);
  }
  .horizon-glow {
    position: absolute; left: 0; right: 0; bottom: 42%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-purple), var(--neon-blue), transparent);
    box-shadow: 0 0 24px 4px var(--glow-pink);
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce){
    .star { animation: none; }
  }

  .wrap { width: 100%; max-width: 460px; position: relative; z-index: 1; }

  /* ===== card principal ===== */
  .deck {
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--card-edge);
    border-radius: 26px;
    padding: 30px 22px 22px;
    box-shadow:
      0 0 0 1px rgba(178,102,255,0.08),
      0 0 40px -6px var(--glow-purple),
      0 30px 60px -30px rgba(0,0,0,0.8);
  }

  /* ===== vinil ===== */
  .player { position: relative; width: 246px; height: 246px; margin: 4px auto 14px; }

  .holo-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    background: conic-gradient(from 0deg,
      var(--neon-purple), var(--neon-blue), var(--neon-pink), var(--base), var(--neon-purple));
    filter: blur(0.4px);
    animation: holoSpin 6s linear infinite;
    box-shadow: 0 0 26px 2px var(--glow-purple), 0 0 46px 6px var(--glow-pink);
  }
  .holo-ring::after {
    content: ""; position: absolute; inset: 6px; border-radius: 50%;
    background: var(--bg-2);
  }
  @keyframes holoSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .holo-ring { animation: none; } }

  .record-spin {
    position: relative; width: 100%; height: 100%;
    transform-origin: 50% 50%;
    animation: spin 3s linear infinite;
    animation-play-state: paused;
  }
  .record-spin.playing { animation-play-state: running; }
  @media (prefers-reduced-motion: reduce){ .record-spin { animation: none !important; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tonearm-group { transform-origin: 216px 32px; transition: transform 0.6s cubic-bezier(.65,0,.35,1); }

  .spin-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 8.6px;
    font-weight: 700;
    letter-spacing: 0.14em;
    fill: var(--ink);
  }

  .track-info { text-align: center; margin-bottom: 4px; }
  .track-artist { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.03em; }
  .player-status { font-size: 11px; color: var(--neon-blue); margin-top: 6px; min-height: 14px; font-family: 'Orbitron', sans-serif; letter-spacing: 0.03em; }
  .player-status.err { color: var(--neon-pink); }

  /* ===== progresso ===== */
  .progress-row {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: var(--ink-soft);
  }
  .progress-bar {
    flex: 1; height: 7px;
    background: var(--bg-3);
    border: 1px solid var(--card-edge);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute; left:0; top:0; bottom:0;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink), var(--neon-blue));
    box-shadow: 0 0 12px 1px var(--glow-pink);
    border-radius: 999px;
  }

  /* ===== transporte ===== */
  .transport {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 22px;
  }

  button { cursor: pointer; border: none; font-family: 'Rajdhani', sans-serif; transition: transform .12s ease, box-shadow .2s ease, color .15s ease, background .2s ease; }
  button:active { transform: scale(0.93); }
  button:focus-visible { outline: 2px solid var(--neon-blue); outline-offset: 2px; }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg-3); color: var(--ink-soft);
    border: 1px solid var(--card-edge);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--neon-purple); box-shadow: 0 0 14px -2px var(--glow-purple); }
  .icon-btn.toggle-active {
    color: var(--bg);
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border-color: transparent;
    box-shadow: 0 0 16px 0 var(--glow-pink);
  }

  .play-btn {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--neon-blue), var(--neon-purple) 70%);
    color: #0A0714; font-size: 20px;
    box-shadow: 0 0 22px 2px var(--glow-purple), 0 0 40px 4px var(--glow-blue);
  }
  .play-btn.playing-pulse { animation: pulseGlow 1.6s ease-in-out infinite; }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 22px 2px var(--glow-purple), 0 0 40px 4px var(--glow-blue); }
    50% { box-shadow: 0 0 34px 6px var(--glow-pink), 0 0 60px 10px var(--glow-purple); }
  }

  .volume-row { display: flex; align-items: center; gap: 10px; margin: 20px 0 4px; }
  .volume-row span { font-size: 15px; filter: drop-shadow(0 0 4px var(--glow-blue)); }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--ink); cursor: pointer; border: 2px solid var(--neon-purple);
    box-shadow: 0 0 8px 1px var(--glow-purple);
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--ink); cursor: pointer; border: 2px solid var(--neon-purple);
    box-shadow: 0 0 8px 1px var(--glow-purple);
  }

  /* ===== divisores ===== */
  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--neon-blue);
    text-shadow: 0 0 8px var(--glow-blue);
    margin: 20px 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--card-edge), transparent); }

  /* ===== pills ===== */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .pill {
    padding: 7px 14px; border-radius: 999px;
    background: var(--bg-3); color: var(--ink-soft);
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
    font-size: 12px; border: 1px solid var(--card-edge);
  }
  .pill:hover { border-color: var(--neon-blue); color: var(--ink); }
  .pill.active {
    color: var(--bg);
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
    border-color: transparent;
    box-shadow: 0 0 14px -2px var(--glow-purple);
  }

  /* ===== playlist em cards com glow ===== */
  .track-list {
    max-height: 300px; overflow-y: auto;
    margin-top: 6px;
    display: flex; flex-direction: column; gap: 7px;
    padding: 2px 2px 2px 0;
  }
  .track-list::-webkit-scrollbar { width: 6px; }
  .track-list::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

  .track-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px;
    cursor: pointer; font-size: 13px;
    background: var(--bg-3);
    border: 1px solid var(--card-edge);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .track-item:hover { border-color: var(--neon-blue); box-shadow: 0 0 14px -4px var(--glow-blue); }
  .track-item.playing {
    background: linear-gradient(135deg, rgba(178,102,255,0.18), rgba(255,79,216,0.14));
    border-color: var(--neon-pink);
    box-shadow: 0 0 18px -2px var(--glow-pink);
  }
  .track-item.broken { opacity: 0.5; }
  .track-item.broken .t::after { content: " ⚠"; }
  .track-item .n { font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--ink-soft); width: 18px; }
  .track-item.playing .n { color: var(--neon-pink); }
  .track-item .meta { flex: 1; min-width: 0; }
  .track-item .meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .track-item .meta .a { font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-note {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    padding: 20px 10px; line-height: 1.6;
    font-family: 'Rajdhani', sans-serif;
  }
  .empty-note code { background: var(--bg-3); padding: 1px 5px; border-radius: 5px; color: var(--neon-blue); }

  footer {
    text-align: center; font-size: 10px; color: var(--ink-soft);
    margin-top: 18px; letter-spacing: 0.05em; opacity: 0.6;
    font-family: 'Orbitron', sans-serif;
  }
</style>
</head>
<body>

<div class="cyber-bg">
  <div class="glow-orb o1"></div>
  <div class="glow-orb o2"></div>
  <div class="glow-orb o3"></div>
  <div class="stars" id="stars"></div>
  <div class="horizon-glow"></div>
  <div class="grid-floor"></div>
</div>

<div class="wrap">
  <div class="deck">

    <div class="player">
      <div class="holo-ring"></div>
      <svg class="record-spin" id="recordSpin" viewBox="0 0 246 246" width="246" height="246">
        <defs>
          <radialGradient id="vinylBody" cx="42%" cy="38%" r="75%">
            <stop offset="0%" stop-color="#3A2A56"/>
            <stop offset="55%" stop-color="#180F28"/>
            <stop offset="100%" stop-color="#0B0714"/>
          </radialGradient>
          <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <path id="labelCircle" fill="none" d="M 123,84 A 39,39 0 1 1 122.9,84"/>
        </defs>

        <circle cx="123" cy="123" r="111" fill="url(#vinylBody)" stroke="#33224E" stroke-width="1"/>
        <g stroke="#2A1C42" fill="none" stroke-width="0.7" opacity="0.85">
          <circle cx="123" cy="123" r="101"/>
          <circle cx="123" cy="123" r="91"/>
          <circle cx="123" cy="123" r="81"/>
          <circle cx="123" cy="123" r="71"/>
          <circle cx="123" cy="123" r="61"/>
        </g>
        <ellipse cx="90" cy="80" rx="70" ry="34" fill="url(#sheen)" transform="rotate(-28 90 80)"/>

        <circle cx="123" cy="123" r="39" fill="#150C24" stroke="var(--neon-purple)" stroke-width="1.4"/>
        <text class="spin-title">
          <textPath id="spinTitlePath" href="#labelCircle" startOffset="0">· SEM FAIXA CARREGADA ·</textPath>
        </text>
        <circle cx="123" cy="123" r="4" fill="var(--ink)"/>
      </svg>

      <svg class="tonearm-group" id="tonearm" viewBox="0 0 246 246" width="246" height="246" style="position:absolute; top:0; left:0; pointer-events:none;">
        <circle cx="216" cy="32" r="9" fill="#B6A6DA"/>
        <circle cx="216" cy="32" r="3.5" fill="#170F28"/>
        <line x1="216" y1="32" x2="144" y2="75" stroke="var(--neon-blue)" stroke-width="3" stroke-linecap="round"/>
        <rect x="134" y="69" width="16" height="9" rx="2" fill="var(--neon-pink)" transform="rotate(28 144 75)"/>
      </svg>
    </div>

    <div class="track-info">
      <div class="track-artist" id="trackArtist">adicione músicas para começar</div>
      <div class="player-status" id="playerStatus"></div>
    </div>

    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      <span id="durTime">0:00</span>
    </div>

    <div class="transport">
      <button class="icon-btn" id="shuffleBtn" title="Ordem aleatória" aria-pressed="false">🔀</button>
      <button class="icon-btn" id="prevBtn" title="Faixa anterior">⏮</button>
      <button class="play-btn" id="playBtn" title="Tocar / Pausar">▶</button>
      <button class="icon-btn" id="nextBtn" title="Próxima faixa">⏭</button>
      <button class="icon-btn toggle-active" id="repeatBtn" title="Repetir lista" aria-pressed="true">🔁</button>
    </div>

    <div class="volume-row">
      <span>🔈</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="70">
    </div>

    <div class="section-label">listas</div>
    <div class="pills" id="playlistPills"></div>

    <div class="section-label">faixas</div>
    <div class="track-list" id="trackList">
      <div class="empty-note">carregando <code>playlists.json</code>...</div>
    </div>

  </div>

  
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  // ---- estrelas de fundo ----
  const starsEl = document.getElementById('stars');
  const STAR_COUNT = 60;
  for (let i = 0; i < STAR_COUNT; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = (Math.random() * 2 + 0.6).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 3.5).toFixed(2) + 's';
    s.style.boxShadow = '0 0 ' + (size * 2) + 'px rgba(244,236,255,0.8)';
    starsEl.appendChild(s);
  }

  const els = {
    audio: document.getElementById('audio'),
    record: document.getElementById('recordSpin'),
    tonearm: document.getElementById('tonearm'),
    spinTitle: document.getElementById('spinTitlePath'),
    artist: document.getElementById('trackArtist'),
    curTime: document.getElementById('curTime'),
    durTime: document.getElementById('durTime'),
    progressBar: document.getElementById('progressBar'),
    progressFill: document.getElementById('progressFill'),
    playBtn: document.getElementById('playBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    shuffleBtn: document.getElementById('shuffleBtn'),
    repeatBtn: document.getElementById('repeatBtn'),
    volume: document.getElementById('volumeSlider'),
    pills: document.getElementById('playlistPills'),
    trackList: document.getElementById('trackList'),
    playerStatus: document.getElementById('playerStatus')
  };

  const PARK_ANGLE = -16, END_ANGLE = 16;

  let allTracks = [];
  let listas = {};
  let currentListName = 'Todas';
  let queue = [];
  let queueIndex = -1;
  let shuffle = false;
  let repeatAll = true;
  let isPlaying = false;

  fetch('./playlists.json')
    .then(r => {
      if (!r.ok) throw new Error('status ' + r.status);
      return r.json();
    })
    .then(data => {
      allTracks = data.faixas || [];
      listas = data.listas || {};
      if (allTracks.length === 0){
        showEmpty('Nenhuma faixa encontrada em <code>playlists.json</code>. Adicione seus arquivos MP3 na pasta <code>musicas/</code> e liste-os no JSON.');
        return;
      }
      buildPills();
      selectPlaylist('Todas');
    })
    .catch(err => {
      showEmpty('Não foi possível carregar <code>playlists.json</code>. Se você abriu este arquivo direto no navegador (file://), publique no GitHub Pages ou rode um servidor local — navegadores bloqueiam essa leitura por segurança quando o arquivo é aberto localmente.');
      console.warn('Erro ao carregar playlists.json:', err);
    });

  function showEmpty(html){
    els.trackList.innerHTML = '<div class="empty-note">' + html + '</div>';
  }

  function buildPills(){
    const names = ['Todas', ...Object.keys(listas)];
    els.pills.innerHTML = '';
    names.forEach(name => {
      const b = document.createElement('button');
      b.className = 'pill' + (name === currentListName ? ' active' : '');
      b.textContent = name;
      b.addEventListener('click', () => selectPlaylist(name));
      els.pills.appendChild(b);
    });
  }

  function tracksForList(name){
    if (name === 'Todas') return allTracks.slice();
    const files = listas[name] || [];
    return files
      .map(f => allTracks.find(t => t.arquivo === f))
      .filter(Boolean);
  }

  function selectPlaylist(name){
    currentListName = name;
    [...els.pills.children].forEach(b => b.classList.toggle('active', b.textContent === name));
    const tracks = tracksForList(name);
    renderTrackList(tracks);
    buildQueue(tracks, false);
  }

  function renderTrackList(tracks){
    els.trackList.innerHTML = '';
    if (tracks.length === 0){
      showEmpty('Essa lista está vazia por enquanto.');
      return;
    }
    tracks.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item' + (brokenTracks.has(t.arquivo) ? ' broken' : '');
      item.dataset.arquivo = t.arquivo;
      item.innerHTML =
        '<span class="n">' + String(i+1).padStart(2,'0') + '</span>' +
        '<span class="meta"><div class="t">' + escapeHtml(t.titulo || t.arquivo) + '</div>' +
        '<div class="a">' + escapeHtml(t.artista || '') + '</div></span>';
      item.addEventListener('click', () => {
        const tracks = tracksForList(currentListName);
        buildQueue(tracks, shuffle, t.arquivo);
        playCurrent();
      });
      els.trackList.appendChild(item);
    });
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function shuffleArray(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQueue(tracks, useShuffle, startArquivo){
    queue = useShuffle ? shuffleArray(tracks) : tracks.slice();
    if (startArquivo){
      queueIndex = queue.findIndex(t => t.arquivo === startArquivo);
    } else {
      queueIndex = queue.length ? 0 : -1;
    }
  }

  let candidateUrls = [];
  let candidateIndex = 0;
  let stuckTimer = null;
  const brokenTracks = new Set();
  const STUCK_TIMEOUT_MS = 7000;

  // watchdog para travas NO MEIO da reprodução (a faixa começa mas o tempo para de avançar)
  let lastProgressAt = 0;
  let lastProgressTime = 0;
  let stallRetries = 0;
  let hasStartedPlaying = false;
  const STALL_CHECK_MS = 3000;
  const STALL_LIMIT_MS = 6000;
  const STALL_MAX_RETRIES = 2;

  setInterval(() => {
    if (!hasStartedPlaying || els.audio.paused || els.audio.ended || queueIndex < 0) return;
    const now = Date.now();
    const cur = els.audio.currentTime;
    if (cur !== lastProgressTime){
      lastProgressTime = cur;
      lastProgressAt = now;
      stallRetries = 0;
      return;
    }
    if (now - lastProgressAt > STALL_LIMIT_MS){
      const t = queue[queueIndex];
      if (!t) return;
      stallRetries++;
      if (stallRetries > STALL_MAX_RETRIES){
        setStatus('"' + (t.titulo || t.arquivo) + '" travou e não recuperou — pulando', true);
        brokenTracks.add(t.arquivo);
        renderTrackList(tracksForList(currentListName));
        lastProgressAt = now;
        setTimeout(nextTrack, 1200);
      } else {
        setStatus('a faixa travou, tentando recuperar...', true);
        const resumeAt = cur;
        els.audio.load();
        els.audio.currentTime = resumeAt;
        els.audio.play().catch(() => {});
        lastProgressAt = now;
      }
    }
  }, STALL_CHECK_MS);

  function urlCandidates(arquivo){
    const forms = [arquivo, arquivo.normalize('NFC'), arquivo.normalize('NFD')];
    const unique = [...new Set(forms)];
    return unique.map(f => encodeURI('./musicas/' + f));
  }

  function setStatus(msg, isError){
    els.playerStatus.textContent = msg || '';
    els.playerStatus.classList.toggle('err', !!isError);
  }

  function setSpinTitle(text){
    const clean = (text || 'SEM FAIXA').toUpperCase();
    els.spinTitle.textContent = '· ' + clean + ' · ' + clean + ' ';
  }

  function playCurrent(){
    if (queueIndex < 0 || queueIndex >= queue.length) return;
    const t = queue[queueIndex];
    setSpinTitle(t.titulo || t.arquivo);
    els.artist.textContent = t.artista || '';
    setStatus('');
    highlightPlaying(t.arquivo);
    candidateUrls = urlCandidates(t.arquivo);
    candidateIndex = 0;
    lastProgressAt = Date.now();
    lastProgressTime = 0;
    stallRetries = 0;
    hasStartedPlaying = false;
    attemptLoad();
  }

  function attemptLoad(){
    clearTimeout(stuckTimer);
    const t = queue[queueIndex];
    if (!t) return;
    if (candidateIndex >= candidateUrls.length){
      brokenTracks.add(t.arquivo);
      renderTrackList(tracksForList(currentListName));
      setStatus('não foi possível carregar "' + (t.titulo || t.arquivo) + '" — pulando para a próxima', true);
      setTimeout(nextTrack, 1400);
      return;
    }
    els.audio.src = candidateUrls[candidateIndex];
    els.audio.play().catch(() => attemptNextCandidate());
    stuckTimer = setTimeout(attemptNextCandidate, STUCK_TIMEOUT_MS);
  }

  function attemptNextCandidate(){
    candidateIndex++;
    attemptLoad();
  }

  function highlightPlaying(arquivo){
    [...els.trackList.children].forEach(el => {
      el.classList.toggle('playing', el.dataset.arquivo === arquivo);
    });
  }

  function togglePlay(){
    if (queueIndex === -1){
      const tracks = tracksForList(currentListName);
      if (!tracks.length) return;
      buildQueue(tracks, shuffle);
      playCurrent();
      return;
    }
    if (els.audio.paused) els.audio.play().catch(() => {});
    else els.audio.pause();
  }

  function nextTrack(){
    if (!queue.length) return;
    if (queueIndex < queue.length - 1){
      queueIndex++;
    } else if (repeatAll){
      queueIndex = 0;
    } else {
      return;
    }
    playCurrent();
  }

  function prevTrack(){
    if (!queue.length) return;
    if (els.audio.currentTime > 3){
      els.audio.currentTime = 0;
      return;
    }
    queueIndex = queueIndex > 0 ? queueIndex - 1 : queue.length - 1;
    playCurrent();
  }

  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', nextTrack);
  els.prevBtn.addEventListener('click', prevTrack);

  els.shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    els.shuffleBtn.classList.toggle('toggle-active', shuffle);
    els.shuffleBtn.setAttribute('aria-pressed', String(shuffle));
    const current = queue[queueIndex];
    const tracks = tracksForList(currentListName);
    buildQueue(tracks, shuffle, current ? current.arquivo : null);
  });

  els.repeatBtn.addEventListener('click', () => {
    repeatAll = !repeatAll;
    els.repeatBtn.classList.toggle('toggle-active', repeatAll);
    els.repeatBtn.setAttribute('aria-pressed', String(repeatAll));
  });

  els.audio.addEventListener('play', () => {
    isPlaying = true;
    els.record.classList.add('playing');
    els.playBtn.classList.add('playing-pulse');
    els.playBtn.textContent = '❚❚';
  });
  els.audio.addEventListener('playing', () => {
    clearTimeout(stuckTimer);
    hasStartedPlaying = true;
    lastProgressAt = Date.now();
    lastProgressTime = els.audio.currentTime;
    stallRetries = 0;
    setStatus('');
    const t = queue[queueIndex];
    if (t && brokenTracks.has(t.arquivo)){
      brokenTracks.delete(t.arquivo);
      renderTrackList(tracksForList(currentListName));
      highlightPlaying(t.arquivo);
    }
  });
  els.audio.addEventListener('pause', () => {
    isPlaying = false;
    els.record.classList.remove('playing');
    els.playBtn.classList.remove('playing-pulse');
    els.playBtn.textContent = '▶';
  });
  els.audio.addEventListener('error', () => {
    if (queueIndex >= 0) attemptNextCandidate();
  });
  els.audio.addEventListener('ended', nextTrack);

  els.audio.addEventListener('timeupdate', () => {
    const cur = els.audio.currentTime || 0;
    const dur = els.audio.duration || 0;
    els.curTime.textContent = fmt(cur);
    els.durTime.textContent = fmt(dur);
    const pct = dur ? (cur / dur) * 100 : 0;
    els.progressFill.style.width = pct + '%';
    const angle = PARK_ANGLE + (END_ANGLE - PARK_ANGLE) * (pct / 100);
    els.tonearm.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
  });

  els.progressBar.addEventListener('click', (e) => {
    const rect = els.progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (els.audio.duration) els.audio.currentTime = pct * els.audio.duration;
  });

  els.volume.addEventListener('input', () => {
    els.audio.volume = els.volume.value / 100;
  });
  els.audio.volume = els.volume.value / 100;

  function fmt(s){
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }
})();
</script>
</body>
</html>
