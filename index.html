<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groovy Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Space+Mono:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6EEFB;
    --bg-2: #ECDFF7;
    --bg-3: #E1CDF2;
    --ink: #4A3565;
    --ink-soft: #7C6294;
    --accent: #B98FE0;
    --accent-2: #E3B6DE;
    --accent-3: #8F6BC4;
    --record: #6E5089;
    --record-dark: #5A4070;
    --cream: #FBF6FF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
  }

  body {
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 44px 18px 70px;
  }

  /* ---- groovy swirl background ---- */
  .swirl {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.55;
    animation: drift 26s ease-in-out infinite;
  }
  .blob.b1 { width: 420px; height: 420px; background: var(--accent); top: -120px; left: -100px; animation-duration: 30s; }
  .blob.b2 { width: 380px; height: 380px; background: var(--accent-2); bottom: -140px; right: -90px; animation-duration: 34s; animation-delay: -6s; }
  .blob.b3 { width: 300px; height: 300px; background: var(--bg-3); top: 40%; left: 60%; animation-duration: 22s; animation-delay: -12s; }

  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px,-25px) scale(1.08); }
    66% { transform: translate(-20px,20px) scale(0.95); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob { animation: none; }
  }

  .wrap { width: 100%; max-width: 460px; }

  .eyebrow {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent-3);
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Bagel Fat One', cursive;
    font-weight: 400;
    text-align: center;
    font-size: clamp(32px, 8vw, 44px);
    color: var(--ink);
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  .sub {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 30px;
  }

  /* ---- wavy divider signature ---- */
  .wave-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0 14px;
  }
  .wave-divider svg { flex: 1; height: 10px; width: 100%; }
  .wave-divider span {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* ---- deck card ---- */
  .deck {
    background: var(--cream);
    border: 2px solid var(--bg-3);
    border-radius: 28px;
    padding: 30px 24px 22px;
    box-shadow: 0 24px 50px -28px rgba(110, 80, 140, 0.45);
  }

  .player { position: relative; width: 230px; height: 230px; margin: 0 auto 18px; }

  .record-spin {
    width: 100%; height: 100%;
    transform-origin: 50% 50%;
    animation: spin 3s linear infinite;
    animation-play-state: paused;
  }
  .record-spin.playing { animation-play-state: running; }
  @media (prefers-reduced-motion: reduce){ .record-spin { animation: none !important; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tonearm-group { transform-origin: 200px 30px; transition: transform 0.6s cubic-bezier(.65,0,.35,1); }

  .label-title { font-family: 'Space Mono', monospace; font-size: 8.5px; fill: var(--cream); text-anchor: middle; letter-spacing: 0.06em; }

  .track-info { text-align: center; margin-bottom: 6px; }
  .track-title { font-family: 'Bagel Fat One', cursive; font-size: 19px; color: var(--ink); line-height: 1.25; }
  .track-artist { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .progress-row {
    display: flex; align-items: center; gap: 8px;
    margin: 14px 0 20px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
  }
  .progress-bar {
    flex: 1; height: 8px;
    background: var(--bg-2);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute; left:0; top:0; bottom:0;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent));
    border-radius: 999px;
  }

  .transport {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 20px;
  }

  button { cursor: pointer; border: none; font-family: 'Poppins', sans-serif; transition: transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.94); }
  button:focus-visible { outline: 2px solid var(--accent-3); outline-offset: 2px; }

  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--bg-2); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .icon-btn:hover { background: var(--bg-3); }
  .icon-btn.toggle-active { background: var(--accent); color: #fff; }

  .play-btn {
    width: 66px; height: 66px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 75%);
    color: #fff; font-size: 20px;
    box-shadow: 0 10px 22px -8px rgba(185, 143, 224, 0.7);
  }

  .row-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; letter-spacing: 0.14em; color: var(--ink-soft);
    text-align: center; margin-bottom: 8px; text-transform: uppercase;
  }

  .pills {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 6px;
  }
  .pill {
    padding: 7px 14px; border-radius: 999px;
    background: var(--bg-2); color: var(--ink-soft);
    font-size: 11px; border: 2px solid transparent;
  }
  .pill:hover { border-color: var(--accent-2); }
  .pill.active { background: var(--accent); color: #fff; }

  .volume-row { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px; }
  .volume-row span { font-size: 13px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 6px; border-radius: 999px;
    background: var(--bg-2); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 2px solid var(--cream);
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 2px solid var(--cream);
  }

  .track-list {
    max-height: 260px; overflow-y: auto;
    margin-top: 6px;
    border-radius: 14px;
    background: var(--bg-2);
    padding: 6px;
  }
  .track-list::-webkit-scrollbar { width: 6px; }
  .track-list::-webkit-scrollbar-thumb { background: var(--accent-2); border-radius: 4px; }

  .track-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 10px;
    cursor: pointer; font-size: 12.5px;
  }
  .track-item:hover { background: var(--bg-3); }
  .track-item.playing { background: var(--accent); color: #fff; }
  .track-item .n { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--ink-soft); width: 18px; }
  .track-item.playing .n { color: rgba(255,255,255,0.8); }
  .track-item .meta { flex: 1; min-width: 0; }
  .track-item .meta .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-item .meta .a { font-size: 10.5px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-note {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    padding: 20px 10px; line-height: 1.6;
  }
  .empty-note code { background: var(--bg-3); padding: 1px 5px; border-radius: 5px; }

  footer {
    text-align: center; font-size: 10px; color: var(--ink-soft);
    margin-top: 18px; letter-spacing: 0.04em; opacity: 0.8;
  }
</style>
</head>
<body>

<div class="swirl">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="wrap">
  <div class="eyebrow">seu acervo, do seu jeito</div>
  <h1>groovy player</h1>
  <div class="sub">toca as suas músicas direto do repositório</div>

  <div class="deck">

    <div class="player">
      <svg viewBox="0 0 230 230" width="230" height="230">
        <g class="record-spin" id="recordSpin">
          <circle cx="115" cy="115" r="104" fill="var(--record)"/>
          <g stroke="var(--record-dark)" fill="none" stroke-width="0.7" opacity="0.8">
            <circle cx="115" cy="115" r="95"/>
            <circle cx="115" cy="115" r="86"/>
            <circle cx="115" cy="115" r="77"/>
            <circle cx="115" cy="115" r="68"/>
            <circle cx="115" cy="115" r="59"/>
          </g>
          <circle cx="115" cy="115" r="40" fill="var(--accent-2)"/>
          <circle cx="115" cy="115" r="40" fill="none" stroke="#ffffff40" stroke-width="1"/>
          <text x="115" y="112" class="label-title" id="labelTitle" style="fill:var(--ink);">♪ ♪ ♪</text>
          <text x="115" y="124" class="label-title" style="fill:var(--ink); opacity:0.7; font-size:7px;">GROOVY PLAYER</text>
          <circle cx="115" cy="115" r="3.5" fill="var(--cream)"/>
        </g>
        <g class="tonearm-group" id="tonearm">
          <circle cx="200" cy="30" r="9" fill="var(--ink-soft)"/>
          <circle cx="200" cy="30" r="3.5" fill="var(--bg-2)"/>
          <line x1="200" y1="30" x2="132" y2="70" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
          <rect x="122" y="64" width="16" height="9" rx="2" fill="var(--accent-3)" transform="rotate(28 132 70)"/>
        </g>
      </svg>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">nenhuma faixa carregada</div>
      <div class="track-artist" id="trackArtist">adicione músicas para começar</div>
    </div>

    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      <span id="durTime">0:00</span>
    </div>

    <div class="transport">
      <button class="icon-btn" id="shuffleBtn" title="Ordem aleatória" aria-pressed="false">🔀</button>
      <button class="icon-btn" id="prevBtn" title="Faixa anterior">⏮</button>
      <button class="play-btn" id="playBtn" title="Tocar / Pausar">▶</button>
      <button class="icon-btn" id="nextBtn" title="Próxima faixa">⏭</button>
      <button class="icon-btn" id="repeatBtn" title="Repetir lista" aria-pressed="true">🔁</button>
    </div>

    <div class="volume-row">
      <span>🔈</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="70">
    </div>

    <div class="wave-divider">
      <span>listas</span>
      <svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0,5 Q5,0 10,5 T20,5 T30,5 T40,5 T50,5 T60,5 T70,5 T80,5 T90,5 T100,5 T110,5 T120,5 T130,5 T140,5 T150,5 T160,5 T170,5 T180,5 T190,5 T200,5" fill="none" stroke="var(--accent-2)" stroke-width="2"/></svg>
    </div>
    <div class="pills" id="playlistPills"></div>

    <div class="wave-divider">
      <span>faixas</span>
      <svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0,5 Q5,0 10,5 T20,5 T30,5 T40,5 T50,5 T60,5 T70,5 T80,5 T90,5 T100,5 T110,5 T120,5 T130,5 T140,5 T150,5 T160,5 T170,5 T180,5 T190,5 T200,5" fill="none" stroke="var(--accent-2)" stroke-width="2"/></svg>
    </div>
    <div class="track-list" id="trackList">
      <div class="empty-note">carregando <code>playlists.json</code>...</div>
    </div>

  </div>

  <footer>arquivos ficam salvos no seu repositório do GitHub · acesse de qualquer computador</footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  const els = {
    audio: document.getElementById('audio'),
    record: document.getElementById('recordSpin'),
    tonearm: document.getElementById('tonearm'),
    title: document.getElementById('trackTitle'),
    artist: document.getElementById('trackArtist'),
    curTime: document.getElementById('curTime'),
    durTime: document.getElementById('durTime'),
    progressBar: document.getElementById('progressBar'),
    progressFill: document.getElementById('progressFill'),
    playBtn: document.getElementById('playBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    shuffleBtn: document.getElementById('shuffleBtn'),
    repeatBtn: document.getElementById('repeatBtn'),
    volume: document.getElementById('volumeSlider'),
    pills: document.getElementById('playlistPills'),
    trackList: document.getElementById('trackList')
  };

  const PARK_ANGLE = -16, END_ANGLE = 16;

  let allTracks = [];       // [{arquivo, titulo, artista}]
  let listas = {};          // { "Nome da lista": [arquivo, ...] }
  let currentListName = 'Todas';
  let queue = [];           // array of track objects in play order
  let queueIndex = -1;
  let shuffle = false;
  let repeatAll = true;
  let isPlaying = false;

  fetch('./playlists.json')
    .then(r => {
      if (!r.ok) throw new Error('status ' + r.status);
      return r.json();
    })
    .then(data => {
      allTracks = data.faixas || [];
      listas = data.listas || {};
      if (allTracks.length === 0){
        showEmpty('Nenhuma faixa encontrada em <code>playlists.json</code>. Adicione seus arquivos MP3 na pasta <code>musicas/</code> e liste-os no JSON.');
        return;
      }
      buildPills();
      selectPlaylist('Todas');
    })
    .catch(err => {
      showEmpty('Não foi possível carregar <code>playlists.json</code>. Se você abriu este arquivo direto no navegador (file://), publique no GitHub Pages ou rode um servidor local — navegadores bloqueiam essa leitura por segurança quando o arquivo é aberto localmente.');
      console.warn('Erro ao carregar playlists.json:', err);
    });

  function showEmpty(html){
    els.trackList.innerHTML = '<div class="empty-note">' + html + '</div>';
  }

  function buildPills(){
    const names = ['Todas', ...Object.keys(listas)];
    els.pills.innerHTML = '';
    names.forEach(name => {
      const b = document.createElement('button');
      b.className = 'pill' + (name === currentListName ? ' active' : '');
      b.textContent = name;
      b.addEventListener('click', () => selectPlaylist(name));
      els.pills.appendChild(b);
    });
  }

  function tracksForList(name){
    if (name === 'Todas') return allTracks.slice();
    const files = listas[name] || [];
    return files
      .map(f => allTracks.find(t => t.arquivo === f))
      .filter(Boolean);
  }

  function selectPlaylist(name){
    currentListName = name;
    [...els.pills.children].forEach(b => b.classList.toggle('active', b.textContent === name));
    const tracks = tracksForList(name);
    renderTrackList(tracks);
    buildQueue(tracks, false);
  }

  function renderTrackList(tracks){
    els.trackList.innerHTML = '';
    if (tracks.length === 0){
      showEmpty('Essa lista está vazia por enquanto.');
      return;
    }
    tracks.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.dataset.arquivo = t.arquivo;
      item.innerHTML =
        '<span class="n">' + String(i+1).padStart(2,'0') + '</span>' +
        '<span class="meta"><div class="t">' + escapeHtml(t.titulo || t.arquivo) + '</div>' +
        '<div class="a">' + escapeHtml(t.artista || '') + '</div></span>';
      item.addEventListener('click', () => {
        const tracks = tracksForList(currentListName);
        buildQueue(tracks, shuffle, t.arquivo);
        playCurrent();
      });
      els.trackList.appendChild(item);
    });
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function shuffleArray(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQueue(tracks, useShuffle, startArquivo){
    queue = useShuffle ? shuffleArray(tracks) : tracks.slice();
    if (startArquivo){
      queueIndex = queue.findIndex(t => t.arquivo === startArquivo);
    } else {
      queueIndex = queue.length ? 0 : -1;
    }
  }

  function playCurrent(){
    if (queueIndex < 0 || queueIndex >= queue.length) return;
    const t = queue[queueIndex];
    els.audio.src = './musicas/' + t.arquivo;
    els.title.textContent = t.titulo || t.arquivo;
    els.artist.textContent = t.artista || '';
    els.audio.play().catch(() => {});
    highlightPlaying(t.arquivo);
  }

  function highlightPlaying(arquivo){
    [...els.trackList.children].forEach(el => {
      el.classList.toggle('playing', el.dataset.arquivo === arquivo);
    });
  }

  function togglePlay(){
    if (queueIndex === -1){
      const tracks = tracksForList(currentListName);
      if (!tracks.length) return;
      buildQueue(tracks, shuffle);
      playCurrent();
      return;
    }
    if (els.audio.paused) els.audio.play().catch(() => {});
    else els.audio.pause();
  }

  function nextTrack(){
    if (!queue.length) return;
    if (queueIndex < queue.length - 1){
      queueIndex++;
    } else if (repeatAll){
      queueIndex = 0;
    } else {
      return;
    }
    playCurrent();
  }

  function prevTrack(){
    if (!queue.length) return;
    if (els.audio.currentTime > 3){
      els.audio.currentTime = 0;
      return;
    }
    queueIndex = queueIndex > 0 ? queueIndex - 1 : queue.length - 1;
    playCurrent();
  }

  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', nextTrack);
  els.prevBtn.addEventListener('click', prevTrack);

  els.shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    els.shuffleBtn.classList.toggle('toggle-active', shuffle);
    els.shuffleBtn.setAttribute('aria-pressed', String(shuffle));
    const current = queue[queueIndex];
    const tracks = tracksForList(currentListName);
    buildQueue(tracks, shuffle, current ? current.arquivo : null);
  });

  els.repeatBtn.addEventListener('click', () => {
    repeatAll = !repeatAll;
    els.repeatBtn.classList.toggle('toggle-active', repeatAll);
    els.repeatBtn.setAttribute('aria-pressed', String(repeatAll));
  });

  els.audio.addEventListener('play', () => {
    isPlaying = true;
    els.record.classList.add('playing');
    els.playBtn.textContent = '❚❚';
  });
  els.audio.addEventListener('pause', () => {
    isPlaying = false;
    els.record.classList.remove('playing');
    els.playBtn.textContent = '▶';
  });
  els.audio.addEventListener('ended', nextTrack);

  els.audio.addEventListener('timeupdate', () => {
    const cur = els.audio.currentTime || 0;
    const dur = els.audio.duration || 0;
    els.curTime.textContent = fmt(cur);
    els.durTime.textContent = fmt(dur);
    const pct = dur ? (cur / dur) * 100 : 0;
    els.progressFill.style.width = pct + '%';
    const angle = PARK_ANGLE + (END_ANGLE - PARK_ANGLE) * (pct / 100);
    els.tonearm.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
  });

  els.progressBar.addEventListener('click', (e) => {
    const rect = els.progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (els.audio.duration) els.audio.currentTime = pct * els.audio.duration;
  });

  els.volume.addEventListener('input', () => {
    els.audio.volume = els.volume.value / 100;
  });
  els.audio.volume = els.volume.value / 100;

  function fmt(s){
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }
})();
</script>
</body>
</html>
